name: Windows UCRT64

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      # MSYS2's UCRT64 environment, not the msys/mingw32/clang64
      # environments - mixing them produces objects that don't link (see
      # docs/ARCHITECTURE.md "Build and toolchain notes").
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install smoke test
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/obicall-install"
          mkdir -p "$RUNNER_TEMP/relocated"
          cp -r "$RUNNER_TEMP/obicall-install"/* "$RUNNER_TEMP/relocated/"
          "$RUNNER_TEMP/relocated/bin/obicall.exe" doctor --json

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ucrt64-test-logs
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  # Builds the actual mingw-w64-ucrt-x86_64-obicall package via
  # makepkg-mingw, from the pinned release source archive named in
  # packaging/msys2/mingw-w64-obicall/PKGBUILD (never from this checkout
  # directly - see docs/RELEASING_MSYS2.md "Why the PKGBUILD builds from a
  # tagged archive, not the checkout"), then installs the resulting
  # package into a clean MSYS2 environment and re-runs the same
  # installed-package smoke test used for a manual release.
  package:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python

      - name: makepkg-mingw --syncdeps --cleanbuild
        working-directory: packaging/msys2/mingw-w64-obicall
        run: makepkg-mingw --syncdeps --noconfirm --cleanbuild

      - name: Install the built package into this MSYS2 environment
        working-directory: packaging/msys2/mingw-w64-obicall
        run: |
          pkgfile=$(ls mingw-w64-ucrt-x86_64-obicall-*.pkg.tar.zst)
          echo "pkgfile=${pkgfile}" >> "$GITHUB_ENV"
          pacman -U --noconfirm "${pkgfile}"

      - name: Installed-package smoke test (isolated working directory)
        run: |
          mkdir -p "$RUNNER_TEMP/obicall-installed-smoke"
          cd "$RUNNER_TEMP/obicall-installed-smoke"
          unset PYTHONPATH
          obicall.exe --help
          obicall.exe doctor --json
          obicall.exe validate --config "$MINGW_PREFIX/share/obicall/examples/position-fusion.json" --json
          obicall.exe replay --input "$MINGW_PREFIX/share/obicall/recordings/demo.obr" --json
          obicall.exe demo --scenario broker-failover \
            --config "$MINGW_PREFIX/share/obicall/examples/position-fusion.json" --json

      - name: Upload the built package
        uses: actions/upload-artifact@v4
        with:
          name: mingw-w64-ucrt-x86_64-obicall-pkg
          path: packaging/msys2/mingw-w64-obicall/*.pkg.tar.zst

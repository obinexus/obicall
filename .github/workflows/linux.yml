name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 clang

      - name: Configure (Debug, sanitizers on)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DOBICALL_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install smoke test
        run: |
          cmake --install build --prefix "${{ runner.temp }}/obicall-install"
          mkdir -p "${{ runner.temp }}/relocated"
          cp -r "${{ runner.temp }}/obicall-install"/* "${{ runner.temp }}/relocated/"
          "${{ runner.temp }}/relocated/bin/obicall" doctor --json

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-logs
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
